name: HanStock Hub Check

on:
  push:
    branches:
      - main
      - feat/otc-index-hub-20260807
      - hotfix/stock-kbar-bootstrap-20260807
      - feat/stock-futures-front-month-20260808
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Compile Hub Python modules
        run: python -m compileall -q .
      - name: Run Hub unit tests
        env:
          SHIOAJI_QUOTE_ENABLED: "false"
        run: |
          python -m unittest discover -s . -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Import wrapped ASGI app and verify routes
        run: |
          python - <<'PY'
          import hanstock_app

          paths = [getattr(route, "path", "") for route in hanstock_app.app.routes]
          expected = {
              "/api/hub/index/otc/status",
              "/api/hub/index/otc/bars",
              "/api/hub/index/otc/bars1m",
              "/api/hub/bars/{stock_code}",
              "/api/hub/bars1m/{stock_code}",
              "/api/hub/stock-futures",
              "/api/hub/stock-futures/status",
          }
          missing = expected - set(paths)
          if missing:
              raise SystemExit(f"Missing HanStock Hub routes: {sorted(missing)}")

          for path in ("/api/hub/bars/{stock_code}", "/api/hub/bars1m/{stock_code}"):
              count = paths.count(path)
              if count != 1:
                  raise SystemExit(f"Expected exactly one GET route for {path}, found {count}")

          print("HanStock wrapped ASGI import OK; stock futures front-month + resilient stock + OTC routes registered")
          PY
