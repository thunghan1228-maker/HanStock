name: OTC Index Hub Check

on:
  push:
    branches:
      - feat/otc-index-hub-20260807
  pull_request:
    paths:
      - "otc_index.py"
      - "otc_index_hub.py"
      - "otc_index_service.py"
      - "hanstock_app.py"
      - "run_api.py"
      - "test_otc_index.py"
      - "requirements.txt"
      - ".github/workflows/otc-index-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile changed Python modules
        run: python -m py_compile otc_index.py otc_index_hub.py otc_index_service.py hanstock_app.py run_api.py
      - name: Run OTC index unit tests
        run: python -m unittest -v test_otc_index.py
      - name: Import wrapped ASGI app and verify routes
        run: |
          python - <<'PY'
          import hanstock_app

          paths = {getattr(route, "path", "") for route in hanstock_app.app.routes}
          expected = {
              "/api/hub/index/otc/status",
              "/api/hub/index/otc/bars",
              "/api/hub/index/otc/bars1m",
          }
          missing = expected - paths
          if missing:
              raise SystemExit(f"Missing OTC Hub routes: {sorted(missing)}")
          print("HanStock wrapped ASGI import OK; OTC routes registered:", sorted(expected))
          PY
