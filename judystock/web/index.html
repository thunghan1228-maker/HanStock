<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Judy Stock 控制台</title>
  <style>
    :root{color-scheme:dark;--bg:#05070d;--card:#10141f;--card2:#151b2b;--muted:#8b96b3;--line:#232b42;
      --up:#ff3b5c;--down:#22c55e;--gold:#f5b942;--purple:#a855f7;--blue:#3b82f6;--accent:#6ea8fe}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef2ff}
    main{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
    a{color:inherit}
    .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
    .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--up),var(--purple));display:flex;align-items:center;justify-content:center;font-size:15px}
    .ticker{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
    .ticker b{font-size:17px;color:#fff;font-weight:800}
    .spacer{flex:1}
    .pill{border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted);font-size:13px;white-space:nowrap}
    a.btn,button{background:var(--accent);color:#07101f;border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}
    button.secondary,a.btn.secondary{background:#1c2438;color:#fff}

    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    .card h2{font-size:15px;margin:0 0 12px;color:#dfe6ff;display:flex;align-items:center;justify-content:space-between}
    .metric{font-size:26px;font-weight:900;margin-top:4px}.label{color:var(--muted);font-size:12px;letter-spacing:.02em}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;background:#0a0e17;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px}

    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13.5px}
    th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
    .up{color:var(--up)}.down{color:var(--down)}
    .empty{color:var(--muted);padding:16px 4px;font-size:13.5px}.hidden{display:none}
    .status-ok{color:var(--down)}.status-bad{color:var(--up)}

    .price-main{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
    .price-main .price{font-size:34px;font-weight:900}.price-main .change{font-size:16px;font-weight:800}

    .groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .grow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1220;text-decoration:none;font-size:13.5px}
    .grow:hover{border-color:var(--accent)}
    .grow .code{font-weight:800;color:#fff}.grow .chg{font-weight:800}

    .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;background:#1c2438;color:var(--muted)}
    .badge.gold{background:rgba(245,185,66,.18);color:var(--gold)}
    .badge.purple{background:rgba(168,85,247,.18);color:var(--purple)}

    .sig-card{display:flex;gap:14px;padding:12px 14px;margin-bottom:10px;border-radius:10px;background:#0d1220;border-left:4px solid var(--line)}
    .sig-card.buy{border-left-color:var(--up)}
    .sig-card.sell{border-left-color:var(--down)}
    .sig-time{min-width:56px;color:var(--muted);font-size:12px;line-height:1.3}
    .sig-time b{display:block;color:#fff;font-size:15px}
    .sig-body{flex:1;min-width:0}
    .sig-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
    .sig-stock{font-weight:800;color:#fff;background:#1c2438;padding:2px 8px;border-radius:6px;font-size:13px}
    .sig-label{font-weight:800;font-size:13px;padding:3px 10px;border-radius:6px}
    .sig-label.buy{background:rgba(255,59,92,.15);color:var(--up)}
    .sig-label.sell{background:rgba(34,197,94,.15);color:var(--down)}
    .sig-note{color:var(--muted);font-size:12px;white-space:pre-line;line-height:1.5}
    .sig-price{font-weight:800;font-size:16px;align-self:center;white-space:nowrap}

    .pick-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .pick-row{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}

    @media(max-width:800px){.grid3{grid-template-columns:repeat(2,1fr)}.groups{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.grid3,.groups{grid-template-columns:1fr}.pick-cols{grid-template-columns:1fr}.sig-card{flex-wrap:wrap}}
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="brand"><span class="logo">📈</span> Judy Stock</div>
    <div class="ticker">台指期 <b id="futPrice">—</b> <span id="futChange">—</span></div>
    <div class="spacer"></div>
    <a class="btn secondary" href="/kline">K線圖</a>
    <div class="pill">服務狀態：<span id="healthText">檢查中…</span></div>
  </div>

  <div class="grid3">
    <div class="card"><div class="label">族群總數</div><div class="metric" id="groupCount">—</div></div>
    <div class="card"><div class="label">符合 Rule1 紀錄</div><div class="metric" id="passedCount">—</div></div>
    <div class="card"><div class="label">最新產生時間</div><div class="metric" style="font-size:16px" id="generatedAt">—</div></div>
  </div>

  <section class="card" id="futuresSection">
    <h2>台指期即時行情</h2>
    <div id="futuresContent"><div class="empty">載入中…</div></div>
  </section>

  <section class="card">
    <h2>族群強弱排行<span class="badge purple" id="groupStrengthMeta"></span></h2>
    <div id="groupStrengthEmpty" class="empty">載入中…</div>
    <div class="groups hidden" id="groupStrengthGrid"></div>
  </section>

  <section class="card">
    <h2>盤中大戶訊號<span class="badge gold">四項精選／特大買賣單／族群瞬間大單</span></h2>
    <div id="largeOrderEmpty" class="empty">載入中…</div>
    <div id="largeOrderList"></div>
  </section>

  <section class="card">
    <h2>盤中大戶力</h2>
    <div id="largeForceEmpty" class="empty">載入中…</div>
    <div class="groups hidden" id="largeForceGrid"></div>
  </section>

  <section class="card">
    <h2>今日精選（多／空）</h2>
    <div id="picksEmpty" class="empty">載入中…</div>
    <div id="picksContent" class="pick-cols hidden">
      <div><div class="label" style="margin-bottom:8px">做多精選</div><div id="picksBull"></div></div>
      <div><div class="label" style="margin-bottom:8px">做空精選</div><div id="picksBear"></div></div>
    </div>
  </section>

  <section class="card">
    <h2>符合 Rule1 的股票</h2>
    <div id="passedEmpty" class="empty hidden">目前沒有符合 Rule1 的股票。</div>
    <div style="overflow:auto"><table id="passedTable"><thead><tr><th>族群</th><th>代號</th><th>名稱</th><th>漲跌幅</th><th>價差</th><th>收盤</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <h2>查詢族群或股票代號</h2>
    <div class="toolbar"><input id="keyword" placeholder="例如：記憶體、2344"><button id="searchBtn">查詢</button><button class="secondary" id="showAllBtn">查看全部族群</button></div>
    <div id="searchResult" style="margin-top:14px"></div>
  </section>

  <section class="card">
    <h2>工具</h2>
    <div class="toolbar"><a class="btn secondary" href="/docs" target="_blank">API 文件</a><a class="btn secondary" href="/api/rule1/latest" target="_blank">原始 Rule1 JSON</a><button id="refreshBtn">重新整理</button></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
function fmtTime(v){if(!v)return '—';try{return new Date(v).toLocaleString('zh-TW',{hour12:false})}catch{return v}}
async function jsonFetch(url){const r=await fetch(url);if(!r.ok){const t=await r.text();throw new Error(t||`HTTP ${r.status}`)}return r.json()}

function fmtNum(v,d=2){if(v==null||v==='')return '—';return Number(v).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d})}
function signedNum(v,d=2){if(v==null||v==='')return '—';const n=Number(v);return (n>0?'+':'')+n.toFixed(d)}
function chgClass(v){if(v==null)return '';return Number(v)>0?'up':Number(v)<0?'down':''}

async function loadHealth(){
  try{const h=await jsonFetch('/api/health');$('#healthText').textContent='正常';$('#healthText').className='status-ok';$('#groupCount').textContent=h.group_count}
  catch(e){$('#healthText').textContent='異常';$('#healthText').className='status-bad'}
}

async function updateFutures(){
  const content=$('#futuresContent');
  try{
    const res=await jsonFetch('/api/quote/futures');
    const tick=res.data||{};
    const cls=chgClass(tick.price_chg);
    $('#futPrice').className=cls;$('#futPrice').textContent=fmtNum(tick.close,0);
    $('#futChange').className=cls;$('#futChange').textContent=`${signedNum(tick.price_chg,0)} (${signedNum(tick.pct_chg)}%)`;
    content.innerHTML=`<div class="price-main"><span class="price ${cls}">${fmtNum(tick.close,0)}</span><span class="change ${cls}">${signedNum(tick.price_chg,0)} (${signedNum(tick.pct_chg)}%)</span></div><div class="label" style="margin-top:6px">成交時間：${tick.tick_time||'—'}</div>`;
  }catch(e){content.innerHTML='<div class="empty">即時行情尚未啟用或尚未收到資料。</div>';$('#futPrice').textContent='—';$('#futChange').textContent='—'}
}

function renderSignalRow(s){
  const kind=String(s.kind||'');
  const isBuy=kind.toLowerCase().includes('buy')||kind.includes('Bullish');
  const dir=isBuy?'buy':'sell';
  const noteText=String(s.note||'').replace(/\|/g,'｜');
  const time=s.barTs?new Date(Number(s.barTs)).toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit'}):'—';
  return `<div class="sig-card ${dir}">
    <div class="sig-time"><b>${time}</b></div>
    <div class="sig-body">
      <div class="sig-head">
        <a class="sig-stock" href="/kline?code=${encodeURIComponent(s.ticker||'')}">${s.ticker||''} ${s.name||''}</a>
        <span class="sig-label ${dir}">${s.label||kind}</span>
      </div>
      <div class="sig-note">${noteText}</div>
    </div>
    <div class="sig-price ${dir}">${s.price!=null?fmtNum(s.price):''}</div>
  </div>`;
}

async function loadLargeOrders(){
  const empty=$('#largeOrderEmpty'),list=$('#largeOrderList');
  try{
    const d=await jsonFetch('/api/battle/daytrade-signals');
    const signals=[...(d.fourGateSignals||[]),...(d.extraLargeSignals||[]),...(d.instantLargeSignals||[])]
      .sort((a,b)=>(Number(b.barTs)||0)-(Number(a.barTs)||0));
    empty.classList.toggle('hidden',!!signals.length);
    if(!signals.length){empty.textContent='今日尚無四項精選、特大買賣單或族群瞬間大單訊號。';list.innerHTML='';return}
    list.innerHTML=signals.slice(0,50).map(renderSignalRow).join('');
  }catch(e){empty.textContent='訊號暫時無法取得。';empty.classList.remove('hidden');list.innerHTML=''}
}

async function loadGroupStrength(){
  const empty=$('#groupStrengthEmpty'),grid=$('#groupStrengthGrid'),meta=$('#groupStrengthMeta');
  try{
    const d=await jsonFetch('/api/group-strength');
    const groups=d.groups||[];
    empty.classList.toggle('hidden',!!groups.length);
    grid.classList.toggle('hidden',!groups.length);
    if(!groups.length){empty.textContent='族群強弱排行暫時沒有資料。';return}
    meta.textContent=`快照 ${d.quote_count}/${d.requested_count} 檔`;
    const rising=groups.slice(0,6),falling=groups.slice(-6).reverse();
    const row=(g,rank)=>`<div class="grow"><span>${rank}　${g.group_name}</span><span class="chg ${chgClass(g.avg_change_rate)}">${signedNum(g.avg_change_rate)}%</span></div>`;
    grid.innerHTML=`<div style="grid-column:1/-1;color:var(--muted);font-size:12px;margin-bottom:-2px">漲幅前六大族群</div>`
      +rising.map((g,i)=>row(g,i+1)).join('')
      +`<div style="grid-column:1/-1;color:var(--muted);font-size:12px;margin:6px 0 -2px">跌幅前六大族群</div>`
      +falling.map((g,i)=>row(g,i+1)).join('');
  }catch(e){empty.textContent='即時行情尚未啟用，或族群強弱排行暫時無法取得。';empty.classList.remove('hidden');grid.classList.add('hidden')}
}

async function loadLargeForce(){
  const empty=$('#largeForceEmpty'),grid=$('#largeForceGrid');
  try{
    const d=await jsonFetch('/api/battle/large-force?limit=12');
    const rows=d.rows||[];
    empty.classList.toggle('hidden',!!rows.length);
    grid.classList.toggle('hidden',!rows.length);
    if(!rows.length){empty.textContent='盤中大戶力暫時沒有資料。';return}
    grid.innerHTML=rows.map(r=>`<a class="grow" href="/kline?code=${encodeURIComponent(r.ticker||r.code||'')}"><span class="code">${r.ticker||r.code||''} ${r.name||''}</span><span class="chg ${chgClass(r.forcePct)}">${signedNum(r.forcePct)}%</span></a>`).join('');
  }catch(e){empty.textContent='盤中大戶力暫時無法取得。';empty.classList.remove('hidden');grid.classList.add('hidden')}
}

async function loadDailyPicks(){
  const empty=$('#picksEmpty'),content=$('#picksContent');
  try{
    const d=await jsonFetch('/api/battle/daily-picks');
    const bull=d.bull||[],bear=d.bear||[];
    empty.classList.toggle('hidden',!!(bull.length||bear.length));
    content.classList.toggle('hidden',!(bull.length||bear.length));
    if(!bull.length && !bear.length){empty.textContent='今日精選尚未產生。';return}
    const row=item=>`<div class="pick-row"><a href="/kline?code=${encodeURIComponent(item.ticker||'')}"><span class="sig-stock">${item.ticker||''} ${item.name||''}</span></a><span>${item.score!=null?fmtNum(item.score,1):''}</span></div>`;
    $('#picksBull').innerHTML=bull.map(row).join('')||'<div class="empty">無</div>';
    $('#picksBear').innerHTML=bear.map(row).join('')||'<div class="empty">無</div>';
  }catch(e){empty.textContent='今日精選暫時無法取得。';empty.classList.remove('hidden');content.classList.add('hidden')}
}

async function loadRule1(){
  try{const d=await jsonFetch('/api/rule1/passed');$('#passedCount').textContent=d.count;$('#generatedAt').textContent=fmtTime(d.generated_at);
    const tbody=$('#passedTable tbody');tbody.innerHTML='';const stocks=d.stocks||[];$('#passedTable').classList.toggle('hidden',!stocks.length);$('#passedEmpty').classList.toggle('hidden',!!stocks.length);
    stocks.forEach(s=>{const tr=document.createElement('tr');const cls=s.price_change>0?'up':s.price_change<0?'down':'';tr.innerHTML=`<td>${s.group_name}</td><td><a href="/kline?code=${encodeURIComponent(s.stock_code)}">${s.stock_code}</a></td><td>${s.stock_name}</td><td class="${cls}">${Number(s.change_rate).toFixed(2)}%</td><td class="${cls}">${Number(s.price_change).toFixed(2)}</td><td>${Number(s.today_close).toFixed(2)}</td>`;tbody.appendChild(tr)})
  }catch(e){$('#passedEmpty').textContent='尚無 Rule1 結果。';$('#passedEmpty').classList.remove('hidden');$('#passedTable').classList.add('hidden')}
}

async function search(){const k=$('#keyword').value.trim();if(!k)return;const box=$('#searchResult');box.textContent='查詢中…';try{const d=await jsonFetch('/api/groups/'+encodeURIComponent(k));box.innerHTML=d.matched_groups.map(g=>`<div style="margin:12px 0"><strong>${g.group_name}</strong>（${g.stock_count}檔）<div class="groups" style="margin-top:8px">${g.stocks.map(s=>`<a class="grow" href="/kline?code=${encodeURIComponent(s.stock_code)}"><span class="code">${s.stock_code} ${s.stock_name}</span></a>`).join('')}</div></div>`).join('')}catch(e){box.innerHTML='<span class="status-bad">查無資料</span>'}}
async function showAll(){const box=$('#searchResult');box.textContent='載入中…';try{const d=await jsonFetch('/api/groups');box.innerHTML=`<div class="groups">${d.groups.map(g=>`<div class="grow"><strong>${g.group_name}</strong><span class="label">${g.stock_count} 檔</span></div>`).join('')}</div>`}catch(e){box.textContent='載入失敗'}}

$('#searchBtn').onclick=search;
$('#showAllBtn').onclick=showAll;
$('#refreshBtn').onclick=()=>{loadHealth();loadRule1();updateFutures();loadLargeOrders();loadDailyPicks();loadGroupStrength();loadLargeForce()};
$('#keyword').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

loadHealth();
loadRule1();
updateFutures();
loadLargeOrders();
loadDailyPicks();
loadGroupStrength();
loadLargeForce();
setInterval(updateFutures,3000);
setInterval(loadLargeOrders,10000);
setInterval(loadGroupStrength,20000);
setInterval(loadLargeForce,15000);
</script>
</body>
</html>
