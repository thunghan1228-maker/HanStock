<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HanStock 盤中戰鬥版 B 測試</title>
<style>
:root{color-scheme:dark;--bg:#05070c;--panel:#0d1119;--panel2:#111722;--line:#263040;--text:#f3f6fb;--muted:#8792a5;--red:#ff5b67;--blue:#4da3ff;--green:#35d49a;--yellow:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#172033 0,#080b11 42%,#05070c 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
main{max-width:1180px;margin:auto;padding:18px 14px 90px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-size:25px;font-weight:900}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:3px}.live{border:1px solid #31513f;background:#0d2119;color:var(--green);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:linear-gradient(145deg,rgba(17,23,34,.98),rgba(9,12,18,.98));border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 30px #0005}.label{color:var(--muted);font-size:12px;font-weight:700}.value{font-size:27px;font-weight:900;margin-top:5px}.up{color:var(--red)}.down{color:var(--blue)}.flat{color:var(--muted)}.section{margin-top:12px}.section h2{font-size:16px;margin:0 0 10px}.ticker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:#0b1018;border:1px solid var(--line);border-radius:11px;padding:11px}.tile b{font-size:15px}.tile span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.tile strong{display:block;font-size:20px;margin-top:5px}.bar{height:6px;background:#1b2330;border-radius:9px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;width:65%;background:var(--red);border-radius:9px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row{display:flex;align-items:center;justify-content:space-between;background:#0a0f17;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.row .name{font-weight:800}.row .meta{font-size:12px;color:var(--muted)}.big{font-size:19px;font-weight:900}.search{display:flex;gap:8px}.search input{flex:1;background:#080c13;border:1px solid var(--line);border-radius:10px;color:#fff;padding:11px 12px}.search button{border:0;border-radius:10px;padding:0 16px;background:#e7edf7;color:#07101a;font-weight:900}.notice{color:var(--muted);font-size:12px;margin-top:9px}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(700px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#0c1119ee;border:1px solid var(--line);backdrop-filter:blur(14px);padding:6px;border-radius:16px}.bottom a{color:var(--muted);text-decoration:none;text-align:center;padding:9px 4px;border-radius:10px;font-size:11px;font-weight:800}.bottom a.active{background:#1a2331;color:#fff}.empty{color:var(--muted);padding:12px}.status{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}.ticker{grid-template-columns:1fr}.list{grid-template-columns:1fr}}@media(max-width:430px){main{padding-left:10px;padding-right:10px}.brand{font-size:21px}.value{font-size:23px}}
</style></head>
<body><main>
<header class="head"><div class="brand">HanStock 盤中戰鬥版<small>Battle · 帳號 B 測試環境</small></div><div class="live" id="live">● SYSTEM CHECK</div></header>
<section class="grid">
<div class="card"><div class="label">市場狀態</div><div class="value" id="market">盤中</div><div class="status" id="time">同步檢查中…</div></div>
<div class="card"><div class="label">Rule1 強勢</div><div class="value up" id="up">—</div><div class="status">目前符合條件</div></div>
<div class="card"><div class="label">弱勢 / 回落</div><div class="value down" id="down">—</div><div class="status">即時資料</div></div>
<div class="card"><div class="label">族群</div><div class="value" id="groups">—</div><div class="status">HanStock 分類</div></div>
</section>
<section class="card section"><h2>強勢主線</h2><div class="ticker" id="leaders"></div></section>
<section class="card section"><h2>弱勢 / 反向觀察</h2><div class="ticker" id="weak"></div></section>
<section class="card section"><h2>上櫃領漲</h2><div class="list" id="stocks"></div></section>
<section class="card section"><h2>聯電股接棒</h2><div class="row"><div><div class="name">2330 台積電</div><div class="meta">主流權值 · 即時觀察</div></div><div class="big up">等待行情</div></div><div class="row" style="margin-top:8px"><div><div class="name">2303 聯電</div><div class="meta">半導體族群 · 接棒監控</div></div><div class="big flat">監控中</div></div></section>
<section class="card section"><h2>OTC 櫃買指數</h2><div class="row"><div><div class="name">OTC</div><div class="meta">櫃買市場盤中狀態</div></div><div class="big" id="otc">—</div></div><div class="bar"><i id="bar"></i></div></section>
<section class="card section"><h2>快速研究</h2><div class="search"><input id="q" placeholder="輸入股票代號或族群，例如 2330 / 記憶體"><button onclick="search()">查詢</button></div><div id="result" class="notice">資料會直接從 B 測試站 API 取得。</div></section>
</main>
<nav class="bottom"><a class="active" href="/">戰鬥</a><a href="/api/groups" target="_blank">自選股</a><a href="/api/rule1/passed" target="_blank">三角收斂</a><a href="/docs" target="_blank">個股研究中心</a></nav>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
function tile(name,code,val,cls){return `<div class="tile"><b>${esc(name)}</b><span>${esc(code)}</span><strong class="${cls||'flat'}">${esc(val)}</strong><div class="bar"><i style="width:${Math.max(15,Math.min(95,50+Math.random()*40))}%"></i></div></div>`}
async function load(){
 try{const h=await get('/api/health');$('#groups').textContent=h.group_count??'—';$('#live').textContent='● B 測試站正常';$('#live').style.color='var(--green)';$('#time').textContent='API 已連線 · '+new Date().toLocaleTimeString('zh-TW');
  const r=await get('/api/realtime/latest');const q=r.quotes||[];const ups=q.filter(x=>(x.change_rate||0)>0).sort((a,b)=>(b.change_rate||0)-(a.change_rate||0));const downs=q.filter(x=>(x.change_rate||0)<0).sort((a,b)=>(a.change_rate||0)-(b.change_rate||0));
  $('#up').textContent=r.summary?.up??ups.length;$('#down').textContent=r.summary?.down??downs.length;$('#otc').textContent=q.length?'即時':'等待';
  $('#leaders').innerHTML=(ups.slice(0,6).map(x=>tile(x.name||x.code,x.code,`${Number(x.change_rate||0).toFixed(2)}%`,'up')).join(''))||tile('盤中主線','—','等待資料','flat');
  $('#weak').innerHTML=(downs.slice(0,6).map(x=>tile(x.name||x.code,x.code,`${Number(x.change_rate||0).toFixed(2)}%`,'down')).join(''))||tile('弱勢監控','—','等待資料','flat');
  $('#stocks').innerHTML=(ups.slice(0,10).map(x=>`<div class="row"><div><div class="name">${esc(x.code)} ${esc(x.name)}</div><div class="meta">成交 ${esc(x.volume??'—')}</div></div><div class="big up">${Number(x.change_rate||0).toFixed(2)}%</div></div>`).join(''))||'<div class="empty">目前尚無即時股票資料。</div>';
 }catch(e){$('#live').textContent='● B API 待命';$('#live').style.color='var(--yellow)';$('#time').textContent='首頁已載入，等待行情同步';$('#leaders').innerHTML=tile('主力行情','—','等待同步','flat');$('#weak').innerHTML=tile('風險監控','—','等待同步','flat')}
}
async function search(){const q=$('#q').value.trim();if(!q)return;$('#result').textContent='查詢中…';try{const d=await get('/api/groups/'+encodeURIComponent(q));$('#result').innerHTML=d.matched_groups?.map(g=>`<b>${esc(g.group_name)}</b>（${g.stock_count} 檔）<br><span class="notice">${g.stocks?.slice(0,20).map(s=>esc(s.stock_code)+' '+esc(s.stock_name)).join(' · ')||''}</span>`).join('<hr style="border-color:var(--line)">')||'查無資料'}catch(e){$('#result').textContent='查無資料，請改用股票代號或族群名稱。'}}
load();setInterval(load,30000);
</script></body></html>
