<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HanStock</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--muted:#9aa6bf;--line:#2a3554;--good:#46d59a;--bad:#ff6b7a;--accent:#6ea8fe}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1020,#11172a);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef3ff}
main{max-width:900px;margin:0 auto;padding:32px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:8px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted)}
.card{background:rgba(21,28,48,.9);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.18);margin-top:18px}.hero{margin-top:24px}.hero h2{margin:0 0 10px}.hero p{color:var(--muted);line-height:1.7;margin:0}.status{display:flex;align-items:center;gap:10px;margin-top:16px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#555}.dot.good{background:var(--good);box-shadow:0 0 6px var(--good)}.dot.bad{background:var(--bad);box-shadow:0 0 6px var(--bad)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;background:#25304d;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#07101f}.muted{color:var(--muted)}pre{white-space:pre-wrap;color:#dfe7fa}
</style></head><body><main>
<div class="top"><div><h1>HanStock</h1><div class="sub">台股即時行情與主力副圖</div></div><div class="pill">服務狀態：<span id="healthText">檢查中…</span></div></div>
<section class="card hero"><h2>主力副圖</h2><p>保留台股即時行情與主力副圖資料。已移除台指期、Rule1、三角收斂、VCP，以及舊的高頻前端輪詢。</p><div class="status"><span class="dot" id="healthDot"></span><span id="statusText">檢查服務中…</span></div></section>
<section class="card"><h2>工具</h2><p class="muted">股票即時行情服務維持運作；主力副圖資料仍由既有股票 Hub API 提供。</p><div class="toolbar"><a class="btn primary" href="/docs" target="_blank" rel="noopener">API 文件</a><button class="btn" id="refreshBtn">檢查服務</button></div><pre id="details" class="muted"></pre></section>
</main><script>
const $=s=>document.querySelector(s);async function checkHealth(){const text=$('#healthText'),dot=$('#healthDot'),status=$('#statusText'),details=$('#details');try{const r=await fetch('/api/health',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(`HTTP ${r.status}`);text.textContent='正常';dot.className='dot good';status.textContent='台股即時行情服務正常';details.textContent=JSON.stringify({quote_connected:data.quote_connected,subscribed:data.subscribed,data_source:data.data_source,last_quote_time:data.last_quote_time,quote_age_seconds:data.quote_age_seconds},null,2)}catch(err){text.textContent='異常';dot.className='dot bad';status.textContent='行情服務目前無法確認';details.textContent=String(err)}}$('#refreshBtn').addEventListener('click',checkHealth);checkHealth();
</script></body></html>
