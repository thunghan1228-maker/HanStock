<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HanStock 控制台</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151c30;--muted:#9aa6bf;--line:#2a3554;--good:#46d59a;--warn:#f59e0b;--bad:#ff6b7a;--accent:#6ea8fe}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(140deg,#0b1020,#11172a);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef3ff}
    main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
    h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:8px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.card{background:rgba(21,28,48,.9);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 35px rgba(0,0,0,.18)}
    .metric{font-size:30px;font-weight:800;margin-top:6px}.label{color:var(--muted);font-size:14px}.section{margin-top:18px}.section h2{font-size:20px;margin:0 0 14px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;background:#0c1325;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
    button,a.btn{background:var(--accent);color:#07101f;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#25304d!important;color:#fff!important}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}.down{color:#7db7ff}.up{color:#ff7b88}
    .empty{color:var(--muted);padding:18px 0}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.group{padding:12px;border:1px solid var(--line);border-radius:10px;background:#10172a}
    .status-ok{color:var(--good)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}pre{white-space:pre-wrap;color:#dfe7fa}.hidden{display:none}

    /* 台指期即時行情區塊 */
    .futures-section{margin-bottom:8px}
    .futures-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
    .futures-status{display:flex;align-items:center;gap:8px;font-size:13px}
    .status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
    .status-dot.green{background:var(--good);box-shadow:0 0 6px var(--good)}
    .status-dot.orange{background:var(--warn);box-shadow:0 0 6px var(--warn)}
    .status-dot.red{background:var(--bad);box-shadow:0 0 6px var(--bad)}
    .status-dot.gray{background:#555}
    .futures-price-main{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .futures-price-main .price{font-size:42px;font-weight:900}
    .futures-price-main .change{font-size:20px;font-weight:700}
    .futures-price-main .code-badge{font-size:13px;color:var(--muted);margin-left:8px}
    .futures-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .futures-grid .item{display:flex;flex-direction:column;gap:2px}
    .futures-grid .item-label{font-size:11px;color:var(--muted)}
    .futures-grid .item-value{font-size:15px;font-weight:600}
    .futures-meta{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
    .futures-placeholder{padding:24px;text-align:center;color:var(--muted)}

    @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.groups{grid-template-columns:1fr 1fr}.futures-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.grid,.groups{grid-template-columns:1fr}h1{font-size:28px}.futures-grid{grid-template-columns:1fr 1fr}.futures-price-main .price{font-size:32px}.futures-price-main .change{font-size:16px}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>HanStock 控制台</h1><div class="sub">台灣股票族群與 Rule1 最新掃描結果</div></div>
    <div class="pill">本機 API：<span id="healthText">檢查中…</span></div>
  </div>

  <!-- 台指期即時行情區塊 -->
  <section class="card section futures-section" id="futuresSection">
    <div class="futures-header">
      <h2>台指期即時行情</h2>
      <div class="futures-status">
        <span class="status-dot gray" id="futuresDot"></span>
        <span id="futuresStatusText">連線中…</span>
      </div>
    </div>
    <div id="futuresContent">
      <div class="futures-placeholder">載入中…</div>
    </div>
  </section>

  <div class="grid">
    <div class="card"><div class="label">族群總數</div><div class="metric" id="groupCount">—</div></div>
    <div class="card"><div class="label">有符合股票的族群</div><div class="metric" id="matchedGroups">—</div></div>
    <div class="card"><div class="label">符合 Rule1 紀錄</div><div class="metric" id="passedCount">—</div></div>
    <div class="card"><div class="label">最新產生時間</div><div class="metric" style="font-size:17px" id="generatedAt">—</div></div>
  </div>

  <section class="card section">
    <h2>符合 Rule1 的股票</h2>
    <div id="passedEmpty" class="empty hidden">目前沒有符合 Rule1 的股票。</div>
    <div style="overflow:auto"><table id="passedTable"><thead><tr><th>族群</th><th>代號</th><th>名稱</th><th>漲跌幅</th><th>價差</th><th>收盤</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card section">
    <h2>查詢族群或股票代號</h2>
    <div class="toolbar"><input id="keyword" placeholder="例如：記憶體、2344"><button id="searchBtn">查詢</button><button class="secondary" id="showAllBtn">查看全部族群</button></div>
    <div id="searchResult" style="margin-top:16px"></div>
  </section>

  <section class="card section" id="triangleScreener">
    <div class="futures-header"><h2>盤後選股｜日線三角收斂</h2><span class="label" id="triangleGenerated">尚未掃描</span></div>
    <div class="toolbar" style="margin-bottom:12px">
      <button class="secondary triangle-filter" data-status="">全部</button>
      <button class="secondary triangle-filter" data-status="接近突破">接近突破</button>
      <button class="secondary triangle-filter" data-status="放量突破">放量突破</button>
    </div>
    <div id="triangleEmpty" class="empty">載入盤後選股結果中…</div>
    <div style="overflow:auto"><table id="triangleTable" class="hidden"><thead><tr><th>狀態</th><th>代號</th><th>名稱</th><th>收盤</th><th>距上緣</th><th>量比</th><th>分數</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card section" id="vcpScreener">
    <div class="futures-header"><h2>選股程式｜VCP 波動收縮</h2><span class="label" id="vcpGenerated">尚未掃描</span></div>
    <div class="toolbar" style="margin-bottom:12px">
      <button class="secondary vcp-filter" data-status="">全部</button>
      <button class="secondary vcp-filter" data-status="VCP形成中">VCP形成中</button>
      <button class="secondary vcp-filter" data-status="接近突破">接近突破</button>
      <button class="secondary vcp-filter" data-status="今日帶量突破">今日帶量突破</button>
      <button class="secondary vcp-filter" data-status="突破後過熱">突破後過熱</button>
    </div>
    <div id="vcpEmpty" class="empty">載入 VCP 掃描結果中…</div>
    <div style="overflow:auto"><table id="vcpTable" class="hidden"><thead><tr><th>狀態</th><th>代號</th><th>名稱</th><th>收盤</th><th>樞紐價</th><th>距樞紐</th><th>收縮幅度</th><th>量比</th><th>分數</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card section">
    <h2>工具</h2>
    <div class="toolbar"><a class="btn secondary" href="/docs" target="_blank">API 文件</a><a class="btn secondary" href="/api/rule1/latest" target="_blank">原始 Rule1 JSON</a><button id="refreshBtn">重新整理</button></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
function fmtTime(v){if(!v)return '—';try{return new Date(v).toLocaleString('zh-TW',{hour12:false})}catch{return v}}
function fmtNum(v,d=2){if(v==null||v==='')return '—';return Number(v).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtInt(v){if(v==null||v==='')return '—';return Number(v).toLocaleString('zh-TW')}
function chgClass(v){if(v==null)return '';return Number(v)>0?'up':Number(v)<0?'down':''}
function signedNum(v,d=2){if(v==null||v==='')return '—';const n=Number(v);return (n>0?'+':'')+n.toFixed(d)}
async function jsonFetch(url){const r=await fetch(url);if(!r.ok){const t=await r.text();throw new Error(t||`HTTP ${r.status}`)}return r.json()}

// ===== 台指期即時行情 =====
let lastFuturesData = null;
let lastFuturesUpdate = null;

function renderFutures(health, data) {
  const dot = $('#futuresDot');
  const statusText = $('#futuresStatusText');
  const content = $('#futuresContent');

  const connected = health.quote_connected === true;
  const subscribed = health.subscribed === true;
  const loggedIn = health.shioaji_logged_in === true;
  const stale = health.quote_stale === true;

  // 狀態判斷
  if (!loggedIn || !connected || !subscribed) {
    dot.className = 'status-dot red';
    statusText.textContent = '行情連線異常';
    statusText.className = 'status-bad';
  } else if (stale) {
    dot.className = 'status-dot orange';
    statusText.textContent = '非交易時段或行情暫停';
    statusText.className = 'status-warn';
  } else {
    dot.className = 'status-dot green';
    statusText.textContent = '即時連線';
    statusText.className = 'status-ok';
  }

  // 使用新資料或保留上一筆
  const tick = data || lastFuturesData;
  if (!tick) {
    content.innerHTML = '<div class="futures-placeholder">尚未收到行情資料</div>';
    return;
  }
  if (data) {
    lastFuturesData = data;
    lastFuturesUpdate = new Date();
  }

  const priceClass = chgClass(tick.price_chg);
  content.innerHTML = `
    <div class="futures-price-main">
      <span class="price ${priceClass}">${fmtNum(tick.close, 0)}</span>
      <span class="change ${priceClass}">${signedNum(tick.price_chg, 0)} (${signedNum(tick.pct_chg)}%)</span>
      <span class="code-badge">${tick.code || '—'}</span>
    </div>
    <div class="futures-grid">
      <div class="item"><span class="item-label">開盤</span><span class="item-value">${fmtNum(tick.open, 0)}</span></div>
      <div class="item"><span class="item-label">最高</span><span class="item-value">${fmtNum(tick.high, 0)}</span></div>
      <div class="item"><span class="item-label">最低</span><span class="item-value">${fmtNum(tick.low, 0)}</span></div>
      <div class="item"><span class="item-label">單筆量</span><span class="item-value">${fmtInt(tick.volume)}</span></div>
      <div class="item"><span class="item-label">累計量</span><span class="item-value">${fmtInt(tick.total_volume)}</span></div>
      <div class="item"><span class="item-label">買方累計</span><span class="item-value">${fmtInt(tick.bid_side_total_vol)}</span></div>
      <div class="item"><span class="item-label">賣方累計</span><span class="item-value">${fmtInt(tick.ask_side_total_vol)}</span></div>
      <div class="item"><span class="item-label">成交時間</span><span class="item-value">${tick.tick_time || '—'}</span></div>
    </div>
    <div class="futures-meta">
      <span>行情延遲：${health.quote_age_seconds != null ? health.quote_age_seconds + ' 秒' : '—'}</span>
      <span>連線：${connected ? '✓' : '✗'}</span>
      <span>訂閱：${subscribed ? '✓' : '✗'}</span>
      <span>Stale：${stale ? '是' : '否'}</span>
      <span>最後更新：${lastFuturesUpdate ? lastFuturesUpdate.toLocaleString('zh-TW',{hour12:false}) : '—'}</span>
    </div>
  `;
}

async function updateFutures() {
  try {
    const health = await jsonFetch('/api/health');
    $('#healthText').textContent = '正常';
    $('#healthText').className = 'status-ok';
    $('#groupCount').textContent = health.group_count;

    let data = null;
    try {
      const res = await jsonFetch('/api/quote/futures');
      data = res.data || null;
    } catch (e) {
      // /api/quote/futures 可能回 503/404，保留上一筆行情
    }
    renderFutures(health, data);
  } catch (e) {
    // /api/health 本身失敗
    $('#healthText').textContent = '異常';
    $('#healthText').className = 'status-bad';
    const dot = $('#futuresDot');
    const statusText = $('#futuresStatusText');
    dot.className = 'status-dot red';
    statusText.textContent = '行情連線異常';
    statusText.className = 'status-bad';
  }
}

// ===== Rule1 =====
async function loadRule1(){
  try{const d=await jsonFetch('/api/rule1/passed');$('#passedCount').textContent=d.count;$('#generatedAt').textContent=fmtTime(d.generated_at);
    const tbody=$('#passedTable tbody');tbody.innerHTML='';const stocks=d.stocks||[];$('#passedTable').classList.toggle('hidden',!stocks.length);$('#passedEmpty').classList.toggle('hidden',!!stocks.length);
    stocks.forEach(s=>{const tr=document.createElement('tr');const cls=s.price_change>0?'up':s.price_change<0?'down':'';tr.innerHTML=`<td>${s.group_name}</td><td>${s.stock_code}</td><td>${s.stock_name}</td><td class="${cls}">${Number(s.change_rate).toFixed(2)}%</td><td class="${cls}">${Number(s.price_change).toFixed(2)}</td><td>${Number(s.today_close).toFixed(2)}</td>`;tbody.appendChild(tr)})
  }catch(e){$('#passedEmpty').textContent='尚無 Rule1 結果，請先在 HanStock 執行 r1all。';$('#passedEmpty').classList.remove('hidden');$('#passedTable').classList.add('hidden')}
  try{const d=await jsonFetch('/api/rule1/latest?passed_only=true');$('#matchedGroups').textContent=d.summary?.groups_with_results??'—'}catch{}
}

// ===== 搜尋 =====
async function search(){const k=$('#keyword').value.trim();if(!k)return;const box=$('#searchResult');box.textContent='查詢中…';try{const d=await jsonFetch('/api/groups/'+encodeURIComponent(k));box.innerHTML=d.matched_groups.map(g=>`<div style="margin:12px 0"><strong>${g.group_name}</strong>（${g.stock_count}檔）<div class="groups" style="margin-top:8px">${g.stocks.map(s=>`<div class="group">${s.stock_code} ${s.stock_name}</div>`).join('')}</div></div>`).join('')}catch(e){box.innerHTML='<span class="status-bad">查無資料</span>'}}
async function showAll(){const box=$('#searchResult');box.textContent='載入中…';try{const d=await jsonFetch('/api/groups');box.innerHTML=`<div class="groups">${d.groups.map(g=>`<div class="group"><strong>${g.group_name}</strong><br><span class="label">${g.stock_count} 檔</span></div>`).join('')}</div>`}catch(e){box.textContent='載入失敗'}}

// ===== 盤後選股：日線三角收斂 =====
async function loadTriangles(status=''){
  const empty=$('#triangleEmpty'),table=$('#triangleTable'),tbody=$('#triangleTable tbody');
  empty.textContent='載入盤後選股結果中…';empty.classList.remove('hidden');table.classList.add('hidden');
  try{
    const query=status?'?status='+encodeURIComponent(status):'';
    const d=await jsonFetch('/api/screener/triangles/latest'+query);
    $('#triangleGenerated').textContent='更新於 '+fmtTime(d.generated_at);tbody.innerHTML='';
    (d.rows||[]).forEach(row=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+row.status+'</td><td>'+row.stock_code+'</td><td>'+(row.stock_name||'—')+'</td><td>'+fmtNum(row.close)+'</td><td>'+signedNum(row.distance_to_upper_pct)+'%</td><td>'+fmtNum(row.volume_ratio_20d)+' 倍</td><td>'+fmtNum(row.score,1)+'</td>';tbody.appendChild(tr)});
    empty.textContent=(d.rows||[]).length?'':'目前沒有符合條件的股票。';empty.classList.toggle('hidden',!!(d.rows||[]).length);table.classList.toggle('hidden',!(d.rows||[]).length);
  }catch(e){empty.textContent='尚無掃描結果；請先完成日 K 更新並執行盤後掃描。'}
}
document.querySelectorAll('.triangle-filter').forEach(button=>button.onclick=()=>loadTriangles(button.dataset.status));

// ===== 選股程式：VCP 波動收縮 =====
async function loadVcp(status=''){
  const empty=$('#vcpEmpty'),table=$('#vcpTable'),tbody=$('#vcpTable tbody');
  empty.textContent='載入 VCP 掃描結果中…';empty.classList.remove('hidden');table.classList.add('hidden');
  try{
    const query=status?'?status='+encodeURIComponent(status):'';
    const d=await jsonFetch('/api/screener/vcp/latest'+query);
    $('#vcpGenerated').textContent='更新於 '+fmtTime(d.generated_at);tbody.innerHTML='';
    (d.rows||[]).forEach(row=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+row.status+'</td><td>'+row.stock_code+'</td><td>'+(row.stock_name||'—')+'</td><td>'+fmtNum(row.close)+'</td><td>'+fmtNum(row.pivot_price)+'</td><td>'+signedNum(row.distance_to_pivot_pct)+'%</td><td>'+(row.contractions_pct||[]).map(v=>fmtNum(v,1)+'%').join(' → ')+'</td><td>'+fmtNum(row.volume_ratio_20d)+' 倍</td><td>'+fmtNum(row.score,1)+'</td>';tbody.appendChild(tr)});
    empty.textContent=(d.rows||[]).length?'':'目前沒有符合條件的股票。';empty.classList.toggle('hidden',!!(d.rows||[]).length);table.classList.toggle('hidden',!(d.rows||[]).length);
  }catch(e){empty.textContent='尚無 VCP 掃描結果；請先完成日 K 更新並執行盤後掃描。'}
}
document.querySelectorAll('.vcp-filter').forEach(button=>button.onclick=()=>loadVcp(button.dataset.status));

// ===== 初始化 =====
$('#searchBtn').onclick=search;
$('#showAllBtn').onclick=showAll;
$('#refreshBtn').onclick=()=>{updateFutures();loadRule1()};
$('#keyword').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

// 首次載入
updateFutures();
loadRule1();
loadTriangles();
loadVcp();

// 每 1 秒更新台指期行情（不重新整理整個網頁）
setInterval(updateFutures, 1000);
</script>
</body>
</html>
