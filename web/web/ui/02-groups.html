<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HanStock - 族群強弱</title><link rel="stylesheet" href="design-system.css"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="../icons/icon-192.png"><style>.group-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:border-color .2s;cursor:pointer}.group-card:hover{border-color:var(--accent)}.group-card__header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.group-card__name{font-weight:700;font-size:15px}.group-card__change{font-size:18px;font-weight:800}.group-card__bar{height:4px;border-radius:2px;background:var(--line);margin:10px 0 8px;overflow:hidden;display:flex}.group-card__bar-up{background:var(--up);height:100%}.group-card__bar-down{background:var(--down);height:100%}.group-card__stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.sort-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.sort-bar select{background:#0c1325;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.hidden{display:none!important}.state-msg{text-align:center;padding:60px 20px;color:var(--muted)}.state-msg__icon{font-size:48px;margin-bottom:12px}.state-msg__title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}.skel-card{height:120px}@media(max-width:768px){.group-grid{grid-template-columns:1fr 1fr}.sort-bar{flex-direction:column;align-items:stretch}}@media(max-width:480px){.group-grid{grid-template-columns:1fr}}</style></head><body data-page="groups"><div class="page"><div class="page-header"><div><h1 class="page-title">族群強弱</h1><div class="page-sub">依漲跌幅排序，即時比較各族群表現</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill source-badge source-badge--mock" data-source-badge>資料來源</span><span class="pill" id="groupCount">— 族群</span></div></div><div class="sort-bar"><select id="sortSelect"><option value="change_desc">漲跌幅 高→低</option><option value="change_asc">漲跌幅 低→高</option><option value="name">名稱排序</option><option value="count">成員數量</option></select><button class="btn btn-secondary" data-action="refresh">重新整理</button></div><div id="groupContent"><div data-state="data" class="hidden"><div class="group-grid" id="groupGrid"></div></div><div data-state="loading"><div class="group-grid"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div></div><div data-state="empty" class="hidden"><div class="state-msg"><div class="state-msg__icon">📭</div><div class="state-msg__title">尚無族群資料</div><p>請先建立股票族群</p></div></div><div data-state="offline" class="hidden"><div class="state-msg"><div class="state-msg__icon">⚡</div><div class="state-msg__title">目前離線</div><p>無法取得族群資料</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="error" class="hidden"><div class="state-msg"><div class="state-msg__icon">❌</div><div class="state-msg__title">載入失敗</div><p>GET /api/groups 回應錯誤</p><button class="btn" data-action="retry">重試</button></div></div></div></div><script src="config.js"></script>
<script src="mock-data.js"></script>

<script src="api-client.js"></script>
<script src="app-shell.js"></script>
