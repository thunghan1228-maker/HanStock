<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HanStock - Rule2</title><link rel="stylesheet" href="design-system.css"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="../icons/icon-192.png"><style>.rule-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}.badge{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700}.badge-long{background:rgba(255,123,136,.15);color:var(--up)}.badge-ver{background:#25304d;color:var(--muted)}.badge-active{background:rgba(70,213,154,.15);color:var(--good)}.signal-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}.signal-card__icon{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:20px}.signal-card__icon--buy{background:rgba(255,123,136,.1)}.signal-card__icon--sell{background:rgba(125,183,255,.1)}.signal-card__name{font-weight:700}.signal-card__detail,.signal-card__time{font-size:12px;color:var(--muted);margin-top:3px}.signal-card__price{font-size:18px;font-weight:800;text-align:right}.signal-card__time{text-align:right}.hidden{display:none!important}.state-msg{text-align:center;padding:60px 20px;color:var(--muted)}.state-msg__icon{font-size:48px;margin-bottom:12px}.state-msg__title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}.skel-row{height:70px;margin-bottom:10px}@media(max-width:768px){.signal-card{grid-template-columns:auto 1fr;gap:8px}.signal-card>:last-child{grid-column:1/-1;text-align:left}}</style></head><body data-page="rule2"><div class="page"><div class="page-header"><div><h1 class="page-title">Rule2 掃描結果</h1><div class="page-sub">五分鐘K策略 — 模組介面</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill source-badge source-badge--mock" data-source-badge>資料來源</span><span class="pill" id="rule2ScanTime">掃描 —</span><button class="btn btn-secondary" data-action="refresh">重新整理</button></div></div><div class="rule-info"><span class="badge badge-long">多空模組</span><span class="badge badge-ver" id="rule2Version">draft</span><span class="badge badge-active" id="rule2Enabled">尚未啟用</span><span style="color:var(--muted);font-size:13px">5分K / 可配置策略</span></div><div class="notice" id="rule2Notice">Rule2 詳細條件尚未確認。</div><div class="grid-4" style="margin-bottom:16px"><div class="card"><div class="label">掃描股票</div><div class="metric" id="rule2Scanned">—</div></div><div class="card"><div class="label">觸發訊號</div><div class="metric text-good" id="rule2Signals">—</div></div><div class="card"><div class="label">多方訊號</div><div class="metric text-up" id="rule2Long">—</div></div><div class="card"><div class="label">空方訊號</div><div class="metric text-down" id="rule2Short">—</div></div></div><div id="rule2Content"><div data-state="data" class="hidden"><div id="rule2List"></div></div><div data-state="loading"><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div></div><div data-state="empty" class="hidden"><div class="state-msg"><div class="state-msg__icon">🔇</div><div class="state-msg__title">目前無觸發訊號</div><p>有訊號時會即時顯示</p></div></div><div data-state="offline" class="hidden"><div class="state-msg"><div class="state-msg__icon">⚡</div><div class="state-msg__title">離線中</div><p>無法取得 Rule2 訊號</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="error" class="hidden"><div class="state-msg"><div class="state-msg__icon">❌</div><div class="state-msg__title">Rule2 載入錯誤</div><p>K線資料或策略 API 失敗</p><button class="btn" data-action="retry">重試</button></div></div></div></div><script src="config.js"></script>
<script src="mock-data.js"></script>
<script src="states.js"></script>
<script src="api-client.js"></script>
<script src="app-shell.js"></script>
<script src="page-controller.js"></script></body></html>
