<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HanStock - 系統狀態</title><link rel="stylesheet" href="design-system.css"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="../icons/icon-192.png"><style>.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px}.status-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:flex-start}.status-card__icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}.status-card__icon--ok{background:rgba(70,213,154,.1)}.status-card__icon--err{background:rgba(255,107,122,.1)}.status-card__icon--warn{background:rgba(255,193,7,.1)}.status-card__body{flex:1;min-width:0}.status-card__title{font-size:13px;color:var(--muted);margin-bottom:3px}.status-card__value{font-size:16px;font-weight:700}.status-card__detail{font-size:12px;color:var(--muted);margin-top:3px}.log-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px}.log-section h2{margin:0 0 14px;font-size:17px}.log-item{display:grid;grid-template-columns:140px 70px 80px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.log-level{font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px;width:fit-content}.log-level--error{background:rgba(255,107,122,.15);color:var(--bad)}.log-level--warn{background:rgba(255,193,7,.15);color:var(--warn)}.log-level--info{background:rgba(110,168,254,.15);color:var(--accent)}.hidden{display:none!important}.state-msg{text-align:center;padding:60px 20px;color:var(--muted)}.state-msg__icon{font-size:48px;margin-bottom:12px}.state-msg__title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}@media(max-width:768px){.status-grid{grid-template-columns:1fr}.log-item{grid-template-columns:1fr;gap:4px}}</style></head><body data-page="system"><div class="page"><div class="page-header"><div><h1 class="page-title">系統狀態</h1><div class="page-sub">HanStock 各元件運行狀態總覽</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill source-badge source-badge--mock" data-source-badge>資料來源</span><span class="pill" id="systemUpdated">更新 —</span><button class="btn" data-action="refresh">重新整理</button></div></div><div id="sysContent"><div data-state="data" class="hidden"><div class="status-grid" id="statusGrid"></div><div class="log-section"><h2>系統紀錄</h2><div id="logList"></div></div></div><div data-state="loading"><div class="status-grid"><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div></div></div><div data-state="offline" class="hidden"><div class="state-msg"><div class="state-msg__icon">⚡</div><div class="state-msg__title">離線中</div><p>無法取得系統狀態</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="error" class="hidden"><div class="state-msg"><div class="state-msg__icon">❌</div><div class="state-msg__title">狀態查詢失敗</div><p>管理 API 無回應</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="empty" class="hidden"><div class="state-msg"><div class="state-msg__icon">📭</div><div class="state-msg__title">無狀態資料</div></div></div></div></div><script src="config.js"></script>
<script src="mock-data.js"></script>
<script src="states.js"></script>
<script src="api-client.js"></script>
<script src="app-shell.js"></script>
<script src="page-controller.js"></script></body></html>
