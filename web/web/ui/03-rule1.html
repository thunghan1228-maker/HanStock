<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HanStock - Rule1</title><link rel="stylesheet" href="design-system.css"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="../icons/icon-192.png"><style>.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.result-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;grid-template-columns:1fr auto;gap:4px 16px}.result-card__group{font-size:11px;color:var(--accent);font-weight:600;grid-column:1/-1}.result-card__name{font-weight:700;font-size:16px}.result-card__code{font-size:12px;color:var(--muted)}.result-card__price{font-size:20px;font-weight:800;text-align:right}.result-card__change{font-size:13px;text-align:right}.result-list{display:flex;flex-direction:column;gap:10px}.hidden{display:none!important}.state-msg{text-align:center;padding:60px 20px;color:var(--muted)}.state-msg__icon{font-size:48px;margin-bottom:12px}.state-msg__title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}.skel-row{height:80px;margin-bottom:10px}@media(max-width:768px){.summary-cards{grid-template-columns:repeat(2,1fr)}}</style></head><body data-page="rule1"><div class="page"><div class="page-header"><div><h1 class="page-title">Rule1 掃描結果</h1><div class="page-sub">日線策略 — 依族群顯示最新掃描結果</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill source-badge source-badge--mock" data-source-badge>資料來源</span><span class="pill" id="rule1ScanTime">掃描時間 —</span><button class="btn btn-secondary" data-action="refresh">重新掃描資料</button></div></div><div class="summary-cards"><div class="card"><div class="label">掃描族群</div><div class="metric" id="rule1TotalGroups">—</div></div><div class="card"><div class="label">有結果族群</div><div class="metric text-accent" id="rule1GroupsWithResults">—</div></div><div class="card"><div class="label">符合股票</div><div class="metric text-good" id="rule1Passed">—</div></div><div class="card"><div class="label">掃描耗時</div><div class="metric" style="font-size:18px" id="rule1Duration">—</div></div></div><div id="ruleContent"><div data-state="data" class="hidden"><div id="rule1List"></div></div><div data-state="loading"><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div></div><div data-state="empty" class="hidden"><div class="state-msg"><div class="state-msg__icon">📭</div><div class="state-msg__title">目前無符合 Rule1 的股票</div><p>所有族群掃描完成，無股票符合條件</p></div></div><div data-state="offline" class="hidden"><div class="state-msg"><div class="state-msg__icon">⚡</div><div class="state-msg__title">離線中</div><p>無法取得 Rule1 結果</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="error" class="hidden"><div class="state-msg"><div class="state-msg__icon">❌</div><div class="state-msg__title">掃描結果載入失敗</div><p>Rule1 API 無回應</p><button class="btn" data-action="retry">重試</button></div></div></div></div><script src="config.js"></script>
<script src="mock-data.js"></script>
<script src="states.js"></script>
<script src="api-client.js"></script>
<script src="app-shell.js"></script>
<script src="page-controller.js"></script></body></html>
