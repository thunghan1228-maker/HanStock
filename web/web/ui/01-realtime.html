<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HanStock - 即時行情</title><link rel="stylesheet" href="design-system.css"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="../icons/icon-192.png"><style>
.quote-row{grid-template-columns:80px 1fr auto auto auto auto auto;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line)}.quote-row:hover{background:rgba(110,168,254,.04)}.quote-name{font-weight:700;font-size:14px}.quote-code{color:var(--muted);font-size:12px}.quote-price{font-size:18px;font-weight:800;text-align:right}.quote-change{font-size:13px;text-align:right}.quote-vol{font-size:12px;color:var(--muted);text-align:right}.quote-header{display:grid;grid-template-columns:80px 1fr auto auto auto auto auto;gap:10px;padding:8px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}.mobile-cards{display:none;flex-direction:column;gap:10px}.m-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}.m-card__info{display:flex;flex-direction:column;gap:2px}.m-card__name{font-weight:700;font-size:15px}.m-card__code{font-size:12px;color:var(--muted)}.m-card__price{font-size:22px;font-weight:800;text-align:right}.m-card__change{font-size:13px;text-align:right}.m-card__row{grid-column:1/-1;display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.m-card__row .val{color:var(--text);font-weight:600}.skel-row{display:grid;grid-template-columns:80px 1fr 80px 60px 60px 60px 60px;gap:10px;padding:14px 10px}.skel-bar{height:16px}.hidden{display:none!important}.state-msg{text-align:center;padding:60px 20px;color:var(--muted)}.state-msg__icon{font-size:48px;margin-bottom:12px}.state-msg__title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}@media(max-width:768px){.desktop-table{display:none!important}.mobile-cards{display:flex!important}.quote-header{display:none}}
</style></head><body data-page="realtime"><div class="page"><div class="page-header"><div><h1 class="page-title">即時行情</h1><div class="page-sub">台灣股票即時報價與族群監控</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill source-badge source-badge--mock" data-source-badge>資料來源</span><span class="pill"><span class="dot dot-ok" id="connDot"></span><span id="connText">連線中</span></span><span class="pill">更新 <span id="updateTime">—</span></span><button class="btn btn-secondary" data-action="refresh">手動更新</button></div></div>
<div class="grid-4" style="margin-bottom:20px"><div class="card"><div class="label">上漲</div><div class="metric text-up" id="summaryUp">—</div></div><div class="card"><div class="label">下跌</div><div class="metric text-down" id="summaryDown">—</div></div><div class="card"><div class="label">符合 Rule1</div><div class="metric text-accent" id="summaryRule1">—</div></div><div class="card"><div class="label">監控族群</div><div class="metric" id="summaryGroups">—</div></div></div>
<div class="card" style="position:relative;padding:0;overflow:hidden" id="mainContent"><div data-state="data" class="hidden"><div class="quote-header desktop-table"><span>代號</span><span>名稱</span><span>成交價</span><span>漲跌幅</span><span>漲跌</span><span>量(張)</span><span>買/賣</span></div><div class="desktop-table" id="quoteList"></div><div class="mobile-cards" id="mobileQuoteList"></div></div><div data-state="loading" style="padding:10px"><div class="skel-row"><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div></div><div class="skel-row"><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div></div><div class="skel-row"><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div></div><div class="skel-row"><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div><div class="skeleton skel-bar"></div></div></div><div data-state="empty" class="hidden"><div class="state-msg"><div class="state-msg__icon">📭</div><div class="state-msg__title">目前無即時行情資料</div><p>盤中時段才會出現即時報價</p></div></div><div data-state="offline" class="hidden"><div class="state-msg"><div class="state-msg__icon">⚡</div><div class="state-msg__title">目前離線</div><p>無法取得即時行情</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="error" class="hidden"><div class="state-msg"><div class="state-msg__icon">❌</div><div class="state-msg__title">資料載入失敗</div><p>API 回應錯誤，請稍後再試</p><button class="btn" data-action="retry">重試</button></div></div></div></div><script src="config.js"></script>
<script src="mock-data.js"></script>
<script src="states.js"></script>
<script src="api-client.js"></script>
<script src="app-shell.js"></script>
<script src="page-controller.js"></script></body></html>
