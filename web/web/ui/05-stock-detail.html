<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HanStock - 個股詳情</title><link rel="stylesheet" href="design-system.css"><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0b1020"><link rel="icon" href="../icons/icon-192.png"><style>.stock-hero{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px}.stock-hero__left h1{margin:0;font-size:32px}.stock-hero__code{color:var(--muted);font-size:14px;margin-top:2px}.stock-hero__price{font-size:42px;font-weight:900}.stock-hero__change{font-size:18px;margin-top:4px}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}.info-cell{background:var(--card);padding:14px;text-align:center}.info-cell__label{font-size:11px;color:var(--muted);margin-bottom:4px}.info-cell__value{font-size:16px;font-weight:700}.chart-placeholder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);height:300px;display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:20px;font-size:14px}.group-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.group-tag{background:#25304d;border-radius:6px;padding:6px 12px;font-size:13px;color:var(--accent)}.hidden{display:none!important}.state-msg{text-align:center;padding:60px 20px;color:var(--muted)}.state-msg__icon{font-size:48px;margin-bottom:12px}.state-msg__title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}@media(max-width:768px){.stock-hero__price{font-size:32px}.info-grid{grid-template-columns:repeat(2,1fr)}.chart-placeholder{height:200px}}</style></head><body data-page="stock"><div class="page"><div class="page-header"><div class="page-sub">個股詳情與所屬族群</div><div><span class="pill source-badge source-badge--mock" data-source-badge>資料來源</span><button class="btn btn-secondary" data-action="refresh" style="margin-left:8px">重新整理</button></div></div><div id="stockContent"><div data-state="data" class="hidden"><div class="stock-hero"><div class="stock-hero__left"><h1 id="stockName">—</h1><div class="stock-hero__code" id="stockCodeGroups">—</div></div><div style="text-align:right"><div class="stock-hero__price" id="stockPrice">—</div><div class="stock-hero__change" id="stockChange">—</div></div></div><div class="info-grid"><div class="info-cell"><div class="info-cell__label">開盤</div><div class="info-cell__value" id="stockOpen">—</div></div><div class="info-cell"><div class="info-cell__label">最高</div><div class="info-cell__value" id="stockHigh">—</div></div><div class="info-cell"><div class="info-cell__label">最低</div><div class="info-cell__value" id="stockLow">—</div></div><div class="info-cell"><div class="info-cell__label">昨收</div><div class="info-cell__value" id="stockPrevClose">—</div></div><div class="info-cell"><div class="info-cell__label">成交量</div><div class="info-cell__value" id="stockVolume">—</div></div><div class="info-cell"><div class="info-cell__label">買一</div><div class="info-cell__value" id="stockBid">—</div></div><div class="info-cell"><div class="info-cell__label">賣一</div><div class="info-cell__value" id="stockAsk">—</div></div><div class="info-cell"><div class="info-cell__label">更新</div><div class="info-cell__value" style="font-size:13px" id="stockUpdated">—</div></div></div><div class="tabs"><button class="tab active">日線</button><button class="tab">5分K（預留）</button><button class="tab">技術指標（預留）</button></div><div class="chart-placeholder">📊 K線圖正式串接區域</div><h3 style="margin:0 0 10px;font-size:16px">所屬族群</h3><div class="group-tags" id="stockGroups"></div><h3 style="margin:20px 0 10px;font-size:16px">Rule 訊號紀錄</h3><div class="card" style="font-size:13px;color:var(--muted)"><p style="margin:0" id="stockSignals">—</p></div></div><div data-state="loading" style="padding-top:40px"><div class="skeleton" style="height:60px;margin-bottom:16px"></div><div class="skeleton" style="height:120px;margin-bottom:16px"></div><div class="skeleton" style="height:300px;margin-bottom:16px"></div></div><div data-state="empty" class="hidden"><div class="state-msg"><div class="state-msg__icon">🔍</div><div class="state-msg__title">找不到此股票</div><p>請確認股票代號是否正確</p></div></div><div data-state="offline" class="hidden"><div class="state-msg"><div class="state-msg__icon">⚡</div><div class="state-msg__title">離線中</div><p>無法取得個股資料</p><button class="btn" data-action="retry">重試</button></div></div><div data-state="error" class="hidden"><div class="state-msg"><div class="state-msg__icon">❌</div><div class="state-msg__title">載入失敗</div><p>API 回應錯誤</p><button class="btn" data-action="retry">重試</button></div></div></div></div><script src="config.js"></script>
<script src="mock-data.js"></script>
<script src="states.js"></script>
<script src="api-client.js"></script>
<script src="app-shell.js"></script>
<script src="page-controller.js"></script></body></html>
